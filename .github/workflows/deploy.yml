name: deploy to cloudflare workers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

env:
  WORKER_NAME: ${{ vars.WORKER_NAME }}
  QUEUE_NAME: ${{ vars.QUEUE_NAME }}
  DOMAIN: ${{ secrets.DOMAIN }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}
  VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
  VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
  THEME: ${{ vars.THEME }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bun run deploy

      - name: Purge Cloudflare CDN Cache
        run: |
          PURGE_DOMAIN=${CDN_DOMAIN:-$DOMAIN}
          echo "Purging CDN cache for $PURGE_DOMAIN"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["'$PURGE_DOMAIN'"]}'
          echo ""
